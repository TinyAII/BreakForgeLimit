# ============================================
# 突破锻造上限 配置文件
# ============================================

# 是否启用（false 时插件完全不干预铁砧）
enabled: true

# 费用模式（二选一）：
#   vanilla  = 原版价格（只突破"过于昂贵"上限，价格完全按原版）
#   discount = 折扣曲线（后期费用打折，比原版平缓，推荐）
cost-mode: discount

# 折扣曲线参数（仅 cost-mode: discount 时生效）
# 效果参考：原版第6次 63 级 → 约 56；第8次 255 级 → 约 140；价格永远递增、永不为负
discount-rate: 0.45    # 最大折扣比例（0.45 = 最狠打 55 折；调 0.3 更温和）
discount-ref: 255      # 参考值（达到该费用后折扣封顶，之后价格继续递增）
